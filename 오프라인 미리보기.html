<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>합격 기록장 · 오프라인 미리보기</title>
<style>
:root{font-family:"Segoe UI","Malgun Gothic",sans-serif;color:#282b26;background:#f7f6f2;--green:#607b6c;--muted:#969991;--line:#eeede7;--card:#fff}*{box-sizing:border-box}body{margin:0;min-width:320px}.layout{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;background:#fffF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:3;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:15px;font-weight:750;color:var(--green)}.date{font-size:11px;color:#777}.main{padding:22px 22px 30px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.eyebrow{font-size:9px;letter-spacing:1.3px;color:#98a094;font-weight:700}.hero h1{font-size:26px;line-height:1.4;letter-spacing:-1px;margin:9px 0 4px}.hero h1 em{font-style:normal;color:var(--green)}.hero p{margin:0;font-size:11px;color:var(--muted)}.stamp{width:84px;height:72px;border:1px solid #e0e7df;border-radius:50%;display:grid;place-content:center;text-align:center;color:#819383;transform:rotate(5deg);font-size:9px;flex-shrink:0}.stamp b{font-size:12px;margin:2px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px}.card{padding:13px 14px;min-height:112px}.card.tint{background:#f0f4f0}.label{font-size:10px;color:#7d8078}.number{font-size:26px;font-weight:750;letter-spacing:-1px;margin:8px 0}.number small{font-size:11px;color:#868981;margin-left:4px}.subline{display:flex;justify-content:space-between;font-size:9px;color:#969991}.progress{height:5px;border-radius:8px;background:#eeefea;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#87a08b;border-radius:8px}.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-bottom:12px}.panel{padding:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px}.panel-title h2{font-size:14px;margin:4px 0 0}.soft-button,.add-button,.primary{border:1px solid #e6ebe5;background:#f8faf8;border-radius:8px;color:var(--green);padding:8px 10px;font-size:10px;font-weight:650;cursor:pointer}.schedule{display:grid}.slot{display:grid;grid-template-columns:93px 1fr auto;align-items:center;min-height:42px;border-bottom:1px solid #f3f2ee;gap:8px}.slot:last-child{border:0}.time{font-size:9px;color:#979990;font-weight:650}.slot b{display:block;font-size:10px}.slot small{font-size:8px;color:#9da098}.pill{font-size:8px;background:#f4f5f1;color:#777c73;padding:4px 6px;border-radius:5px}.subject-list{display:grid;gap:12px}.subject{display:grid;grid-template-columns:24px 47px 1fr 48px;align-items:center;gap:7px}.subject-icon{width:23px;height:23px;display:grid;place-items:center;border-radius:7px;background:#edf2ed;color:var(--green);font-size:9px;font-weight:700}.subject b{font-size:9px}.subject small{font-size:8px;text-align:right;color:#999b94}.bar{height:4px;background:#f0f0ec;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#89a08a}.wide{width:100%;margin-top:13px}.routes{display:grid;gap:10px}.route{display:flex;align-items:center;gap:8px;font-size:9px}.route .pin{width:25px;height:25px;background:#f4f5f1;border-radius:8px;display:grid;place-items:center;color:#82917f}.route span:nth-child(2){flex:1}.route small{display:block;font-size:8px;color:#9a9c94;margin-top:2px}.route strong{font-size:11px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{border:1px solid #eaeae4;background:#fff;color:#7e8179;padding:8px 12px;border-radius:8px;font-size:10px;cursor:pointer}.tab.active{background:#eaf0eb;border-color:#e1e9e1;color:#536d5d;font-weight:700}.course-group{margin-bottom:10px}.group-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid #eee}.group-head b{font-size:11px}.group-head small{margin-left:auto;font-size:8px;color:#989a93}.course{display:grid;grid-template-columns:1fr 72px 105px;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #f2f1ed}.course:last-child{border:0}.course-name{font-size:9px;font-weight:650}.course .count{text-align:right}.course .count b{display:block;font-size:10px}.course .count small{font-size:8px;color:#e87154}.course .add-button{padding:7px 8px;font-size:9px;white-space:nowrap}.course .add-button:disabled{opacity:.45}.sum{background:#edf2ed;border-radius:9px;padding:11px 13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}.sum b{font-size:16px;color:var(--green)}.sum small{font-size:9px;color:#849084}.log{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f0ec}.log .subject-icon{flex-shrink:0}.log>div:nth-child(2){flex:1}.log b{font-size:10px}.log small{display:block;color:#9a9c94;font-size:8px;margin-top:3px}.log time{font-size:9px;color:#777}.blank{padding:32px 10px;text-align:center;color:#969991;font-size:10px}.stats-bars{height:150px;display:flex;align-items:flex-end;gap:12px;padding:12px 10px 0}.stats-bars div{flex:1;text-align:center;color:#888;font-size:8px}.stats-bars i{height:var(--h);display:block;max-width:30px;margin:0 auto 6px;background:#8da18d;border-radius:5px 5px 0 0}.note{font-size:9px;color:#93968e;line-height:1.7}.shift-note{background:#faf6ef;border:1px solid #f1eadf;color:#826b50;border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:9px;line-height:1.7}.shift-note b{color:#6e5b43}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:4;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:#9b9d95;display:grid;gap:3px;justify-items:center;font-size:16px;min-width:54px}.mobile-nav button.active{color:var(--green)}.mobile-nav small{font-size:8px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#354c3e;color:white;padding:10px 14px;border-radius:9px;font-size:10px;z-index:9}.modal{position:fixed;inset:0;background:#1f241f70;display:none;place-items:center;z-index:8;padding:15px}.modal.show{display:grid}.dialog{width:min(380px,100%);background:#fff;border-radius:15px;padding:20px}.dialog h2{margin:0 0 14px;font-size:16px}.dialog label{display:grid;gap:6px;margin:10px 0;font-size:9px;color:#777}.dialog input,.dialog select,.dialog textarea{border:1px solid #e9e9e3;border-radius:8px;padding:10px;font:inherit;font-size:10px;background:#fbfbf9}.dialog textarea{min-height:60px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.primary{background:var(--green);color:#fff;border-color:var(--green)}.footer{text-align:center;padding:18px;color:#a7a9a2;font-size:8px}@media(min-width:850px){.main{padding:30px 34px}.hero h1{font-size:30px}.card{padding:16px;min-height:130px}.panel{padding:19px}.slot{min-height:48px}}@media(max-width:650px){.main{padding:18px 13px}.top{padding:11px 14px}.hero h1{font-size:22px}.hero p{font-size:9px;max-width:255px;line-height:1.5}.stamp{width:64px;height:58px;font-size:7px}.stamp b{font-size:9px}.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:11px;min-height:102px}.card:last-child{grid-column:span 2;min-height:82px}.number{font-size:23px;margin:6px 0}.row2{grid-template-columns:1fr;gap:9px}.panel{padding:13px}.slot{grid-template-columns:78px 1fr auto;min-height:43px}.course{grid-template-columns:1fr 56px;gap:7px}.course .count{grid-column:2;grid-row:1}.course .add-button{grid-column:1/-1;width:100%;padding:9px}.course-name{line-height:1.5}.tabs{overflow:auto}.tab{white-space:nowrap}.footer{padding:14px 10px}.subject{grid-template-columns:24px 43px 1fr 45px}}
</style>
</head>
<body>
<div class="layout"><header class="top"><div class="brand">✦ 합격 기록장 <span style="font-size:8px;color:#a3a69e;font-weight:500"> 오프라인</span></div><div class="date" id="date"></div></header><main class="main" id="app"></main><footer class="footer">합격 기록장 · 이 파일은 인터넷 연결 없이 열 수 있어요. 기록은 이 브라우저에 저장됩니다.</footer></div>
<nav class="mobile-nav" id="nav"></nav>
<div class="modal" id="modal"><form class="dialog" id="record-form"><h2>공부 기록 추가</h2><label>과목<select name="subject"><option>영어</option><option>국어</option><option>행정법</option><option>행정학</option><option>한국사</option></select></label><label>학습 종류<select name="kind"><option>복습·문제풀이</option><option>인강 시청</option><option>단어 암기</option><option>모의고사</option></select></label><label>공부 시간<select name="minutes"><option value="30">30분</option><option value="60" selected>1시간</option><option value="90">1시간 30분</option><option value="120">2시간</option><option value="180">3시간</option></select></label><label>공부한 내용<textarea name="memo" placeholder="예: 행정법 기본강의 3강, 기출 10문제"></textarea></label><div class="actions"><button type="button" class="soft-button" onclick="closeModal()">취소</button><button class="primary">저장</button></div></form></div>
<script>
const subjects=['영어','국어','행정법','행정학'], days=['월','화','수','목','금','토','일'];
const starter={courses:[['국어','[2027] 배영표 국어 기본이론',64,13],['영어','[2027] 헤더진 영어 기본이론',60,11],['영어','[2027] 헤더진 영어 압축 기본이론',31,0],['영어','[2027] 헤더진 영어 One week 복습강의',12,0],['행정학','[2027] 이광호 행정학 One week 복습강의',15,0],['행정학','[2027] 이광호 행정학개론 기본이론',64,2],['행정법','[2027] 이재준 행정법 압축 기본이론',28,1],['행정법','[2027] 이재준 행정법총론 기본이론',67,7]].map((c,i)=>({id:i,subject:c[0],title:c[1],total:c[2],done:c[3]})),logs:[],routes:[['집 → 탐라도서관',9],['도서관 → 편의점',13],['편의점 → 스터디카페',13],['스터디카페 → 집',2]]};
let data;try{data=JSON.parse(localStorage.getItem('pass-note-offline'))||starter}catch{data=starter}if(!data.courses)data=starter;
let page='오늘';function persist(){localStorage.setItem('pass-note-offline',JSON.stringify(data));render()};function key(d=new Date()){return new Intl.DateTimeFormat('sv-SE').format(d)};function minFmt(m){return `${Math.floor(m/60)}시간${m%60?` ${m%60}분`:''}`};function weekLogs(){let d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);let start=key(d);d.setDate(d.getDate()+6);let end=key(d);return data.logs.filter(x=>x.date>=start&&x.date<=end)};function totalM(arr){return arr.reduce((s,x)=>s+Number(x.minutes),0)};function h(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
const menu=[['오늘','⌂'],['시간표','▦'],['인강 진도','▤'],['공부 기록','◷'],['통계','▥']];
function targetForDate(d){let k=key(d),day=(d.getDay()+6)%7;if(k==='2026-11-20')return 7;if(k>='2026-11-16'&&k<='2026-11-22')return [6,6,6,10,7,10,5][day];return [6,6,6,9,9,9,5][day]}
function render(){document.getElementById('date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());document.getElementById('nav').innerHTML=menu.map(([n,ic])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${ic}</span><small>${n}</small></button>`).join('');let el=document.getElementById('app');if(page==='오늘')el.innerHTML=home();else if(page==='시간표')el.innerHTML=weekly();else if(page==='인강 진도')el.innerHTML=lectures();else if(page==='공부 기록')el.innerHTML=records();else el.innerHTML=stats();}
function go(p){page=p;render();window.scrollTo(0,0)}
function home(){let wm=totalM(weekLogs()),tm=totalM(data.logs.filter(x=>x.date===key())),completed=data.courses.reduce((a,c)=>a+c.done,0),all=data.courses.reduce((a,c)=>a+c.total,0),dow=(new Date().getDay()+6)%7,target=targetForDate(new Date());let sched=dow===6?[['09:15–12:15','주간 복습 · 영어 루틴','3시간 학습'],['12:15–13:15','점심 및 휴식','재충전'],['13:15–15:15','부족한 과목 보충','2시간 학습']]:dow>=3?[['09:15–12:15','영어 루틴 · 국어 독해','집중 학습 1차 · 3시간'],['12:15–13:15','점심 및 휴식','재충전'],['13:15–16:15','행정법 기본강의 · 복습','집중 학습 2차 · 3시간'],['16:15–17:15','휴식 및 식사','재충전'],['17:15–20:15','행정학 기본강의','집중 학습 3차 · 3시간']]:[['09:15–10:15','영어 단어 · 기초 문법','매일 루틴 · 1시간'],['10:15–12:15','국어 독해 · 문법','집중 학습 1차 · 2시간'],['12:15–13:15','점심 및 휴식','재충전'],['13:15–15:15','행정법 기본강의 · 복습','집중 학습 2차 · 2시간'],['15:15–16:15','행정학 기본강의','오늘의 학습 목표 · 1시간']];if(dow<3)sched.push(['20:00–24:00','편의점 근무','근무시간']);let recent=weekLogs().slice(0,3);return `<section class="hero"><div><div class="eyebrow">${new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(new Date()).toUpperCase()} · MY STUDY PLAN</div><h1>오늘도 한 걸음,<br><em>합격에 가까워지고 있어.</em></h1><p>꾸준히 쌓는 오늘의 공부가 내일의 실력이 돼.</p></div><div class="stamp">2027<b>합격을 향해</b>KEEP GOING</div></section><div class="shift-note"><b>11월 추가 근무</b> · 9일(월) 16:00–20:00 (기존 20:00–24:00 근무 이어짐) · 20일(금) 16:00–20:00</div><section class="cards"><div class="card tint"><div class="label">오늘 순공부</div><div class="number">${(tm/60).toFixed(tm%60?1:0)}<small>시간</small></div><div class="subline"><span>목표 ${target}시간</span><span>${Math.min(100,Math.round(tm/(target*60)*100))}%</span></div><div class="progress"><i style="width:${Math.min(100,tm/(target*60)*100)}%"></i></div></div><div class="card"><div class="label">이번 주 순공부</div><div class="number">${(wm/60).toFixed(wm%60?1:0)}<small>/ 50시간</small></div><div class="subline"><span>목표까지</span><b>${minFmt(Math.max(0,3000-wm))}</b></div><div class="progress"><i style="width:${Math.min(100,wm/30)}%"></i></div></div><div class="card"><div class="label">인강 진도</div><div class="number">${completed}<small>/ ${all}강</small></div><div class="subline"><span>남은 강의</span><b>약 ${all-completed}시간</b></div><div class="progress"><i style="width:${completed/all*100}%"></i></div></div></section><section class="row2"><div class="panel"><div class="panel-title"><div><div class="eyebrow">YOUR PLAN</div><h2>오늘의 시간표</h2></div><button class="soft-button" onclick="go('시간표')">주간 보기 →</button></div><div class="schedule">${sched.map(x=>`<div class="slot"><span class="time">${x[0]}</span><span><b>${x[1]}</b><small>${x[2]}</small></span></div>`).join('')}</div><p class="note" style="margin:12px 0 0">월·화·수는 편의점 근무 20:00–24:00 · 이동시간은 순공부에서 빼서 기록해.</p></div><div class="panel"><div class="panel-title"><div><div class="eyebrow">SUBJECT BALANCE</div><h2>과목별 공부</h2></div></div><div class="subject-list">${subjects.map((s,i)=>{let m=weekLogs().filter(x=>x.subject===s).reduce((a,x)=>a+ +x.minutes,0);return `<div class="subject"><span class="subject-icon">${['A','국','법','행','한'][i]}</span><b>${s}</b><span class="bar"><i style="width:${Math.min(100,m/600*100)}%"></i></span><small>${minFmt(m)}</small></div>`}).join('')}</div><button class="add-button wide" onclick="openModal()">＋ 공부 기록 추가</button></div></section><section class="row2"><div class="panel"><div class="panel-title"><div><div class="eyebrow">LATEST LOG</div><h2>최근 공부 기록</h2></div><button class="soft-button" onclick="go('공부 기록')">전체 보기 →</button></div>${recent.length?recent.map(logRow).join(''):`<div class="blank">첫 공부 기록을 남겨보자.<br><button class="soft-button" style="margin-top:10px" onclick="openModal()">기록 시작</button></div>`}</div><div class="panel"><div class="panel-title"><div><div class="eyebrow">WALKING ROUTES</div><h2>이동 시간</h2></div></div><div class="routes">${data.routes.map(r=>`<div class="route"><span class="pin">⌖</span><span>${h(r[0])}<small>도보 · 실측</small></span><strong>${r[1]}분</strong></div>`).join('')}</div><p class="note" style="margin:12px 0 0">이동시간은 순공부 시간에서 제외해.</p></div></section>`}
function weekly(){return `<div class="hero"><div><div class="eyebrow">WEEKLY ROUTINE</div><h1>주간 시간표</h1><p>주 50시간 목표 · 영어 매일 · 한국사는 한능검 자격으로 대체</p></div></div><section class="panel">${days.map((d,i)=>`<div class="log"><span class="subject-icon">${d}</span><div><b>${['영어·국어·행정법·행정학','영어·국어·행정법·행정학','영어·국어·행정법·행정학','영어·국어·행정법·행정학','영어·국어·행정법·행정학','영어·국어·행정법·행정학','주간 복습 · 부족 과목 보충'][i]}</b><small>${i<3?'편의점 근무 20:00–24:00 · ':''}${i===6?'복습일':'학습일'}</small></div><time>${[6,6,6,9,9,9,5][i]}시간</time></div>`).join('')}<div class="log"><b style="flex:1">주간 목표</b><b>50시간</b></div></section><section class="panel" style="margin-top:10px"><div class="eyebrow">NOVEMBER SHIFT PLAN</div><h2 style="margin:5px 0 10px;font-size:14px">추가 근무와 주간 목표</h2><p class="note">11/9(월) 16:00–20:00 근무 후 기존 20:00–24:00 근무 · 11/20(금) 16:00–20:00 근무</p><p class="note" style="margin-top:8px">11/16–22 주간 목표: 월 6 · 화 6 · 수 6 · 목 10 · 금 7 · 토 10 · 일 5시간 = 50시간</p><p class="note" style="margin-top:8px">과목 배분: 영어 13 · 국어 8 · 행정법 14.5 · 행정학 14.5시간</p></section><section class="panel" style="margin-top:10px"><div class="eyebrow">MEASURED WALKING ROUTES</div><h2 style="margin:5px 0 12px;font-size:14px">이동시간 (순공부에서 제외)</h2>${data.routes.map(r=>`<div class="log"><div style="flex:1;font-size:10px">${h(r[0])}</div><time>${r[1]}분</time></div>`).join('')}</section>`}
function lectures(){let done=data.courses.reduce((a,c)=>a+c.done,0),all=data.courses.reduce((a,c)=>a+c.total,0);return `<div class="hero"><div><div class="eyebrow">LECTURE TRACKER</div><h1>인강 진도</h1><p>1강 완료를 누르면 1시간 공부 기록도 함께 저장돼.</p></div></div><div class="sum"><b>${done} / ${all}강 수강</b><small>${all-done}강 남음 · 약 ${all-done}시간</small></div>${subjects.filter(s=>data.courses.some(c=>c.subject===s)).map(s=>`<section class="panel course-group"><div class="group-head"><span class="subject-icon">${s.slice(0,1)}</span><b>${s}</b><small>${data.courses.filter(c=>c.subject===s).reduce((a,c)=>a+c.done,0)}강 수강</small></div>${data.courses.filter(c=>c.subject===s).map(c=>`<div class="course"><div><div class="course-name">${h(c.title)}</div><div class="progress"><i style="width:${c.done/c.total*100}%"></i></div></div><div class="count"><b>${c.total}강</b><small>${c.done}강 수강</small></div><button class="add-button" ${c.done>=c.total?'disabled':''} onclick="complete(${c.id})">＋ 1강 완료</button></div>`).join('')}</section>`).join('')}`}
function complete(id){let c=data.courses.find(c=>c.id===id);if(!c||c.done>=c.total)return;c.done++;data.logs.unshift({subject:c.subject,kind:'인강 시청',minutes:60,memo:`${c.title} · ${c.done}강 수강 완료`,date:key()});persist();toast('1강 완료 · 1시간 기록했어')}
function logRow(l){return `<div class="log"><span class="subject-icon">${l.subject==='영어'?'A':l.subject.slice(0,1)}</span><div><b>${h(l.subject)} · ${h(l.kind)}</b><small>${h(l.memo||'공부 기록')}</small></div><time>${minFmt(+l.minutes)}</time></div>`}
function records(){let logs=weekLogs();return `<div class="hero"><div><div class="eyebrow">STUDY LOG</div><h1>공부 기록</h1><p>강의와 복습 시간을 나눠 기록해.</p></div><button class="primary" onclick="openModal()">＋ 기록 추가</button></div><div class="sum"><b>${minFmt(totalM(logs))}</b><small>${logs.length}개 기록 · 주간 목표 50시간</small></div><section class="panel">${logs.length?logs.map(logRow).join(''):`<div class="blank">이번 주 공부 기록이 없어.<br>기록 추가를 눌러 시작해 봐.</div>`}</section>`}
function stats(){let logs=weekLogs(),m=totalM(logs);return `<div class="hero"><div><div class="eyebrow">YOUR PROGRESS</div><h1>학습 통계</h1><p>이번 주 공부 흐름을 확인해.</p></div></div><div class="cards"><div class="card tint"><div class="label">이번 주 순공부</div><div class="number">${minFmt(m)}</div><div class="progress"><i style="width:${Math.min(100,m/30)}%"></i></div></div><div class="card"><div class="label">기록 횟수</div><div class="number">${logs.length}<small>회</small></div></div></div><section class="panel"><div class="eyebrow">BY SUBJECT</div><h2 style="font-size:14px;margin:5px 0">과목별 공부 시간</h2>${subjects.map((s,i)=>{let n=logs.filter(x=>x.subject===s).reduce((a,x)=>a+ +x.minutes,0);return `<div class="log"><span class="subject-icon">${['A','국','법','행','한'][i]}</span><b style="flex:1;font-size:10px">${s}</b><span class="bar" style="width:35%"><i style="width:${m?n/m*100:0}%"></i></span><time>${minFmt(n)}</time></div>`}).join('')}</section><section class="panel" style="margin-top:10px"><div class="eyebrow">WEEKLY TARGET</div><div class="stats-bars">${days.map((d,i)=>{let dt=new Date();dt.setDate(dt.getDate()-(dt.getDay()+6)%7+i);let n=data.logs.filter(x=>x.date===key(dt)).reduce((a,x)=>a+ +x.minutes,0);return `<div><i style="--h:${Math.max(5,Math.min(100,n/540*100))}%"></i>${d}</div>`}).join('')}</div></section>`}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2100)}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('record-form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.currentTarget);data.logs.unshift({subject:f.get('subject'),kind:f.get('kind'),minutes:+f.get('minutes'),memo:f.get('memo'),date:key()});closeModal();e.currentTarget.reset();persist();go('공부 기록');toast('공부 기록을 저장했어')});render();
</script>
</body></html>
